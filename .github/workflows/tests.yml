name: tests

# Corre la suite de PHPUnit en cada PR y en cada push a la rama principal
# (main o master: este repositorio aún no tiene un remoto propio en
# GitHub, así que no hay todavía una única rama por defecto asentada).
#
# No incluye la suite de accesibilidad (tests/accessibility/,
# `npm run test:a11y`): requiere descargar Chromium y levantar el
# servidor de la app, y quedó documentada como un comando manual aparte
# — ver tests/accessibility/README.md.
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl, openssl, dom, xml
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias de npm
        run: npm ci

      - name: Compilar assets
        # Las vistas usan @vite(...); sin el manifest compilado, cualquier
        # prueba que renderice una vista completa (la mayoría de las
        # Feature) falla con ViteManifestNotFoundException.
        run: npm run build

      - name: Ejecutar pruebas
        run: php artisan test
